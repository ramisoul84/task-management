host: localhost:8080
info:
  contact:
    name: Rami Suliman
  description: 'REST API for managing tasks inside teams: role-based access control,
    task history, comments, Redis-cached listings and team analytics.'
  license:
    name: MIT
  title: Task Management API
  version: "1.0"
paths:
  /auth/logout:
    post:
      description: Revokes the bearer access token (if sent) and the refresh-token
        cookie. Idempotent.
      responses:
        "204":
          description: No Content
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Exchanges the refresh-token cookie for a new access token and rotates
        the cookie. Each refresh token works once; replaying an old one fails.
      parameters:
      - description: refresh_token=<token>
        in: header
        name: Cookie
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.RefreshResponse'
        "401":
          description: Missing, expired or reused refresh token
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      summary: Refresh the access token
      tags:
      - Auth
  /login:
    post:
      consumes:
      - application/json
      description: Returns a short-lived JWT access token and sets an HttpOnly refresh-token
        cookie (path /api/v1/auth). Also served at /auth/login.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: refresh_token=...; HttpOnly
              type: string
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.LoginResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      summary: Log in
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Creates an account. Email is case-insensitive and must be unique.
        Also served at /auth/register.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.UserResponse'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /tasks:
    get:
      description: Filtered, paginated list (newest first). Results are cached in
        Redis for 5 minutes per team+filter combination and invalidated on any task
        change.
      parameters:
      - description: Team ID
        format: uuid
        in: query
        name: team_id
        required: true
        type: string
      - description: Status
        enum:
        - todo
        - in_progress
        - review
        - done
        - cancelled
        in: query
        name: status
        type: string
      - description: Assignee
        format: uuid
        in: query
        name: assignee_id
        type: string
      - default: 20
        description: Page size (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.TaskListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "403":
          description: Not a team member
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List a team's tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Any team member can create a task. The caller is the creator; the
        assignee defaults to the caller and must belong to the team.
      parameters:
      - description: Task
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.Task'
        "400":
          description: Validation error / assignee not in team
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "403":
          description: Not a team member
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - Tasks
  /tasks/{id}:
    delete:
      description: Permanently deletes the task with its history and comments. Owner,
        admin or the task's creator only.
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - Tasks
    get:
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_ramisoul84_task-management_internal_domain.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/internal_server_http_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a task
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      description: 'Partial update guarded by optimistic locking: send the version
        you read; a stale version returns 409. Owner/admin/creator may change any
        field; the assignee may change only the status. Every change is recorded in
        history with old and new values.'
      parameters:
      - description: Task ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Fields to change
        in: body
        name: request
        required: true
        schema:
