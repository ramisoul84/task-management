name: tm-test

# Standalone MySQL + Redis used by the integration tests only.
#
# Start it with:  docker compose -f docker-compose.test.yml up -d --wait
# Stop it with:   docker compose -f docker-compose.test.yml down
#
# Host ports are offset (3307 / 6380) to avoid clashing with a local
# development database and are the integration helper's defaults.

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${TEST_DB_NAME:-task_management}
      MYSQL_USER: ${TEST_DB_USER:-tm}
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:-tm}
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${TEST_DB_USER:-tm}", "-p${TEST_DB_PASSWORD:-tm}"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20