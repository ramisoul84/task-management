services:
  mysql:
    image: mysql:8.0
    container_name: tm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - tm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: tm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tm-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # App
      APP_ENV: production
      APP_NAME: ${APP_NAME:-task-management}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MIGRATIONS_DIR: /app/migrations
      
      # Logger
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
      LOG_OUTPUT: stdout
      
      # Server
      HTTP_PORT: "8080"
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-10s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-120s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-15s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      ALLOW_CREDENTIALS: ${ALLOW_CREDENTIALS:-false}
      BODY_LIMIT_MB: ${BODY_LIMIT_MB:-10}
      GLOBAL_RATE_MAX: ${GLOBAL_RATE_MAX:-100}
      GLOBAL_RATE_WINDOW: ${GLOBAL_RATE_WINDOW:-1m}
      AUTH_RATE_MAX: ${AUTH_RATE_MAX:-20}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-1m}
      
      # Database
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_TLS: "false"
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
      DB_CONN_LIFETIME: ${DB_CONN_LIFETIME:-5m}
      DB_CONN_IDLE_TIME: ${DB_CONN_IDLE_TIME:-1m}
      
      # Redis
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES:-3}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-5s}
      REDIS_READ_TIMEOUT: ${REDIS_READ_TIMEOUT:-3s}
      REDIS_WRITE_TIMEOUT: ${REDIS_WRITE_TIMEOUT:-3s}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-20}
      REDIS_MIN_IDLE_CONNS: ${REDIS_MIN_IDLE_CONNS:-5}
      
      # Security
      SECRET: ${SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      ISSUER: ${ISSUER:-task-management}
      COST: ${COST:-12}
      
      # Cache
      TASK_LIST_TTL: ${TASK_LIST_TTL:-5m}
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  tm-mysql-data:
  tm-redis-data: