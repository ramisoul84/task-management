# Local / single-host deployment of the API with MySQL and Redis.
#
#   cp .env.example .env    # then set the secrets
#   docker compose up -d --build --wait
#
# Optional monitoring (Prometheus on :9090):
#   docker compose --profile observability up -d

name: task-management

x-restart: &restart
  restart: unless-stopped

services:
  mysql:
    <<: *restart
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Published on localhost only, for local tooling; never on all interfaces.
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *restart
    build:
      context: .
      args:
        VERSION: ${APP_VERSION:-dev}
    image: task-management:${APP_VERSION:-dev}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Everything comes from .env; the overrides below point the app at the
    # compose network instead of localhost.
    env_file: ${ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_FORMAT: json
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_ADDR: redis:6379
      HTTP_PORT: "8080"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/task-management", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.0.1
    profiles: [observability]
    depends_on: [app]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  mysql-data:
  redis-data:
